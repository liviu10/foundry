# ==============================================================================
# Ultra-lightweight, hardened Nginx configuration for static documentation
# Runs as non-root (UID 101) with minimal memory footprint (<5MB)
# Hardened against DDoS, Slowloris, Information Leaks, and Host Traversal
# ==============================================================================

pid /tmp/nginx.pid;
worker_processes 1;
worker_rlimit_nofile 1024;

error_log stderr warn;

events {
    worker_connections 512;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    default_type application/octet-stream;

    # Temp paths inside tmpfs (/tmp) for read-only root filesystem compatibility
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Disable access logs (traffic is logged at Cloudflare edge; saves disk/CPU)
    access_log off;

    # Real client IP detection behind Cloudflare Tunnel / Reverse Proxy
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # High-performance static delivery
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # Timeouts to protect against Slowloris / hanging connections
    keepalive_timeout 20s;
    keepalive_requests 100;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Memory buffer optimization for static delivery (strictly reject large payloads)
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 2k;

    # Rate limiting zone (DDoS & excessive scraping mitigation)
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # In-memory open file cache
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip compression & Static pre-compressed serving
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_static on;
    gzip_types
        text/css
        application/javascript
        application/json
        text/markdown
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    server {
        listen 8080 default_server;
        server_name foundry.insightdevhub.ro localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Disable directory browsing completely
        autoindex off;

        charset utf-8;
        charset_types text/markdown text/plain application/json text/xml;

        # Enforce rate & concurrent connection limits
        limit_req zone=req_limit_per_ip burst=50 nodelay;
        limit_conn conn_limit_per_ip 20;

        # Only allow safe read-only HTTP methods
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Apply global security headers
        include /etc/nginx/security-headers.conf;

        # Error pages
        error_page 404 /404.html;
        error_page 405 /404.html;

        # ----------------------------------------------------------------------
        # Security: Deny all hidden dotfiles (.git, .foundry-site, etc.)
        # ----------------------------------------------------------------------
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ----------------------------------------------------------------------
        # Security: Deny scripts and backend configuration files
        # ----------------------------------------------------------------------
        location ~* \.(php|phar|sh|bash|py|rb|pl|sql|env|ini|conf|bak|backup|swp|yml|yaml|twig)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ----------------------------------------------------------------------
        # Versioned Static Assets (CSS, JS, Fonts, Images)
        # ----------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Downloadables (e.g. foundry-php83.zip)
        # ----------------------------------------------------------------------
        location /downloads/ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Metadata & Manifests (robots.txt, sitemap.xml, llms.txt, etc.)
        # ----------------------------------------------------------------------
        location ~* \.(json|txt|xml|webmanifest)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Default Documentation Pages
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
