# ==============================================================================
# Ultra-lightweight, hardened Nginx configuration for static documentation
# Runs as non-root (UID 101) with 1 worker and minimal memory footprint (<5MB)
# ==============================================================================

pid /tmp/nginx.pid;
worker_processes 1;
worker_rlimit_nofile 512;

error_log stderr warn;

events {
    worker_connections 256;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    default_type application/octet-stream;

    # Temp paths inside tmpfs (/tmp) for read-only root filesystem compatibility
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Disable access logs (traffic is logged at the Cloudflare edge)
    access_log off;

    # Performance & file handling
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 20s;
    keepalive_requests 100;
    server_tokens off;

    # Memory buffer optimization for static delivery (reject large upload payloads)
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # In-memory file cache
    open_file_cache max=500 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        application/javascript
        application/json
        text/markdown
        text/plain
        image/svg+xml;

    server {
        listen 8080 default_server;
        server_name foundry.insightdevhub.ro localhost;
        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;
        charset_types text/markdown text/plain application/json;

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;

        # Immutable cache for versioned static assets (site.css?v=...)
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Security headers
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
