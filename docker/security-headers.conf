# ==============================================================================
# Hardened Security Headers for Foundry Documentation
# Evaluated for highest security grade (A+ on Mozilla Observatory)
# ==============================================================================

# Protect against MIME type confusion / sniffing
add_header X-Content-Type-Options "nosniff" always;

# Disallow framing completely to eliminate clickjacking
add_header X-Frame-Options "DENY" always;

# Control referrer information passed to third parties
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable browser access to unnecessary client hardware & features
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), sync-xhr=(), usb=()" always;

# Cross-Origin protections to isolate browsing context
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Strict Transport Security (HSTS) with subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy (CSP): pure self-contained static site, no inline code execution
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';" always;

